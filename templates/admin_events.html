<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <nav class="navbar">
    <a href="/admin/events" class="nav-brand">⚙️ Admin Panel</a>
    <div class="nav-links">
      <a href="/admin/events" style="color: #fff;">Event Management</a>
      <a href="/admin/registrations">View Registrations</a>
      <a href="/admin/logout" class="badge">Logout</a>
    </div>
  </nav>

  <div class="container">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
      <h1 style="font-size: 2rem;">Manage Events</h1>
      <a href="{{ url_for('admin_events_new') }}" class="btn">+ Create Event</a>
    </div>

    <div class="table-container">
      {% if events %}
      <table>
        <thead>
          <tr>
            <th>Name</th>
            <th>Date</th>
            <th>Location</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          {% for event in events %}
          <tr>
            <td style="font-weight: 600;">{{ event.name }}</td>
            <td>{{ event.date }}</td>
            <td>{{ event.location }}</td>
            <td>
              <div class="action-buttons">
                <a href="{{ url_for('admin_events_edit', event_id=event.id) }}" class="btn btn-secondary" style="padding: 0.4rem 0.8rem; font-size: 0.85rem;">Edit</a>
                <form action="{{ url_for('admin_events_delete', event_id=event.id) }}" method="POST" onsubmit="return confirm('Are you sure you want to delete this event?');">
                  <button type="submit" class="btn btn-danger" style="padding: 0.4rem 0.8rem; font-size: 0.85rem;">Delete</button>
                </form>
              </div>
            </td>
          </tr>
          {% endfor %}
        </tbody>
      </table>
      {% else %}
      <div class="empty-state">
        <p>No events have been created yet.</p>
      </div>
      {% endif %}
    </div>
  </div>
</body>
</html>
