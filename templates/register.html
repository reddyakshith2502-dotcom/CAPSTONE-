<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register for {{ event.name }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <nav class="navbar">
    <a href="/" class="nav-brand">🎓 CollegeEvents</a>
    <div class="nav-links">
      <a href="/">Home</a>
      <a href="/admin/login">Admin</a>
    </div>
  </nav>

  <div class="container narrow">
    <a href="/" class="btn btn-secondary" style="margin-bottom: 2rem; display: inline-block;">← Back to Events</a>
    
    <div class="form-panel">
      <h2 style="margin-bottom: 0.5rem; font-size: 2rem; color: #fff;">Register for Event</h2>
      <p style="color: var(--text-muted); margin-bottom: 2rem;">{{ event.name }} on {{ event.date }}</p>
      
      <form action="{{ url_for('register', event_id=event.id) }}" method="POST">
        <div class="form-group">
          <label for="full_name">Full Name</label>
          <input type="text" id="full_name" name="full_name" class="form-control" placeholder="Enter your full name" required>
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" class="form-control" placeholder="Enter your email" required>
        </div>

        <div class="form-group">
          <label for="phone">Phone Number (Optional)</label>
          <input type="tel" id="phone" name="phone" class="form-control" placeholder="Enter your phone number">
        </div>

        <button type="submit" class="btn" style="width: 100%; margin-top: 1rem;">Confirm Registration</button>
      </form>
    </div>
  </div>
</body>
</html>
